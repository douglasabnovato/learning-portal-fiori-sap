<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portal de trilhas de estudo em SAPUI5, Fiori, ABAP Cloud, BTP e IA.">
    <title>Learning Portal Fiori SAP</title>
    <!-- Medição sem cookie (GoatCounter, decisão D5 de 10/11/2026): só no site publicado; dev e testes rodam em localhost -->
    <script>
        (function () {
            var h = window.location.hostname;
            if (h === "" || h === "localhost" || h === "127.0.0.1" || h === "[::1]") { return; }
            var s = document.createElement("script");
            s.async = true;
            s.src = "https://gc.zgo.at/count.js";
            s.setAttribute("data-goatcounter", "https://douglasabnovato.goatcounter.com/count");
            document.head.appendChild(s);
        })();
    </script>
    <!-- Bootstrap local (UI5 Tooling em desenvolvimento; incluído no build self-contained). Antes dependia do CDN ui5.sap.com -->
    <script id="sap-ui-bootstrap" src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{ "com.douglas.learningportal": "./" }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted">
    </script>
</head>
<body class="sapUiBody" id="content">
    <div data-sap-ui-component data-name="com.douglas.learningportal" data-id="container" data-settings='{"id" : "learningportal"}'></div>
</body>
</html>
